<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCarta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1820"/>
      <stop offset="100%" stop-color="#0e0c12"/>
    </linearGradient>
    <linearGradient id="envelopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2430"/>
      <stop offset="100%" stop-color="#19151e"/>
    </linearGradient>
    <filter id="glowGold">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bgCarta)"/>
  <!-- Envelope Silhouette -->
  <g transform="translate(150, 80)">
    <rect x="0" y="40" width="300" height="200" rx="14" fill="url(#envelopeGrad)" stroke="rgba(223, 186, 126, 0.3)" stroke-width="2"/>
    <!-- Fold lines -->
    <path d="M 0 40 L 150 160 L 300 40" fill="none" stroke="rgba(223, 186, 126, 0.4)" stroke-width="2"/>
    <path d="M 0 240 L 110 130" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    <path d="M 300 240 L 190 130" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    <!-- Wax Seal -->
    <circle cx="150" cy="155" r="26" fill="#c04e5d" filter="url(#glowGold)"/>
    <circle cx="150" cy="155" r="21" fill="#a83c4b" stroke="#dfba7e" stroke-width="1.5"/>
    <!-- Heart in wax seal -->
    <path d="M 150 148 C 147 142 139 142 137 147 C 134 153 150 165 150 165 C 150 165 166 153 163 147 C 161 142 153 142 150 148 Z" fill="#dfba7e"/>
    <!-- Floating parchment letter coming out -->
    <rect x="30" y="-10" width="240" height="80" rx="8" fill="#fceade" opacity="0.9" transform="rotate(-3 150 40)"/>
    <line x1="55" y1="15" x2="220" y2="15" stroke="#b08b8b" stroke-width="2" stroke-linecap="round"/>
    <line x1="55" y1="30" x2="180" y2="30" stroke="#b08b8b" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
