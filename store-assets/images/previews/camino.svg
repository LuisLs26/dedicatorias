<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCamino" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141522"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3a6b2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#dfba7e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f3a6b2" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bgCamino)"/>
  <!-- Glowing Path -->
  <path d="M 300 20 Q 230 130 370 220 T 300 380" fill="none" stroke="url(#glowLine)" stroke-width="4" filter="url(#blurGlow)"/>
  <!-- Starlight and Petals -->
  <circle cx="300" cy="50" r="16" fill="#1b1d2e" stroke="#f3a6b2" stroke-width="2"/>
  <circle cx="300" cy="50" r="6" fill="#f3a6b2"/>
  
  <circle cx="265" cy="150" r="18" fill="#1b1d2e" stroke="#dfba7e" stroke-width="2"/>
  <circle cx="265" cy="150" r="7" fill="#dfba7e"/>

  <circle cx="360" cy="270" r="22" fill="#1b1d2e" stroke="#f3a6b2" stroke-width="2" filter="url(#blurGlow)"/>
  <circle cx="360" cy="270" r="9" fill="#ffd166"/>

  <circle cx="300" cy="360" r="16" fill="#1b1d2e" stroke="#f3a6b2" stroke-width="2"/>
  <circle cx="300" cy="360" r="6" fill="#f3a6b2"/>

  <!-- Petal details -->
  <path d="M 180 90 C 190 70 210 80 205 100 C 200 120 180 110 180 90 Z" fill="#f3a6b2" opacity="0.6"/>
  <path d="M 420 180 C 435 160 450 175 440 195 C 430 210 415 200 420 180 Z" fill="#dfba7e" opacity="0.6"/>
  <path d="M 150 290 C 165 275 180 285 175 305 C 165 320 145 310 150 290 Z" fill="#f3a6b2" opacity="0.5"/>
</svg>
