<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e183a"/>
      <stop offset="60%" stop-color="#100f20"/>
      <stop offset="100%" stop-color="#07070d"/>
    </radialGradient>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#spaceGrad)"/>
  <!-- Constellation lines -->
  <polyline points="120,280 220,180 340,220 460,110 500,190" fill="none" stroke="rgba(121, 113, 233, 0.5)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Constellation nodes / Planets -->
  <circle cx="120" cy="280" r="10" fill="#7971e9" filter="url(#starGlow)"/>
  <circle cx="220" cy="180" r="14" fill="#f3a6b2" filter="url(#starGlow)"/>
  <circle cx="340" cy="220" r="8" fill="#ffd166"/>
  <circle cx="460" cy="110" r="18" fill="#dfba7e" filter="url(#starGlow)"/>
  <circle cx="500" cy="190" r="9" fill="#91d5ff"/>
  <!-- Orbit rings -->
  <ellipse cx="460" cy="110" rx="35" ry="12" fill="none" stroke="rgba(223, 186, 126, 0.4)" stroke-width="1.5" transform="rotate(-15 460 110)"/>
  <!-- Little stars -->
  <circle cx="80" cy="80" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="280" cy="70" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="400" cy="320" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="190" cy="340" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="530" cy="300" r="2.5" fill="#ffd166" opacity="0.8"/>
</svg>
